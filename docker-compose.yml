services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: stratoscope-ui:local
    container_name: ai-cost-frontend
    ports:
      - "80:80"
    # Static UI; does not require backend to be up — useful for UI-only docker testing
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-cost-backend
    environment:
      APP_NAME: AI-Powered Cloud Cost & Architecture Calculator
      APP_ENV: local
      APP_PORT: 8003
      DATABASE_URL: postgresql+psycopg://architect:architect_local_dev@postgres:5432/architect
      REDIS_URL: redis://redis:6379/0
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: ai-cost-postgres
    environment:
      POSTGRES_DB: architect
      POSTGRES_USER: architect
      POSTGRES_PASSWORD: architect_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architect -d architect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: ai-cost-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
