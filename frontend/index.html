<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Powered Cloud Cost & Architecture Calculator</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1220;
        color: #e2e8f0;
      }
      main {
        max-width: 900px;
        margin: 0 auto;
        padding: 56px 24px;
      }
      .card {
        background: #111a2b;
        border: 1px solid #22324f;
        border-radius: 12px;
        padding: 24px;
      }
      .muted {
        color: #94a3b8;
      }
      code {
        background: #1f2a44;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>AI-Powered Cloud Cost & Architecture Calculator</h1>
        <p class="muted">
          Local frontend is running on port <code>80</code>. Backend health endpoint:
          <code>/health</code> on port <code>8003</code>.
        </p>
      </div>
    </main>
  </body>
</html>
